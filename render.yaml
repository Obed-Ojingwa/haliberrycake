services:
  - type: web
    name: haliberrycake
    env: python
    plan: free
    envVars:
      # These are set for the service, including build and runtime
      CARGO_HOME: /tmp/cargo
      CARGO_TARGET_DIR: /tmp/cargo-target
      CARGO_REGISTRY_INDEX: /tmp/cargo/registry/index
      CARGO_REGISTRY_GIT: /tmp/cargo/registry/git
      RUSTUP_HOME: /tmp/rustup
      PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON: 0
      PIP_NO_BUILD_ISOLATION: 1
      PIP_USE_PEP517: 1
      PIP_PREFER_BINARY: 1
      PIP_NO_CACHE_DIR: 1
    buildCommand: |
      cd backend
      echo "=== ENVIRONMENT VARIABLES ==="
      echo "CARGO_HOME: $CARGO_HOME"
      echo "CARGO_TARGET_DIR: $CARGO_TARGET_DIR"
      echo "CARGO_REGISTRY_INDEX: $CARGO_REGISTRY_INDEX"
      echo "CARGO_REGISTRY_GIT: $CARGO_REGISTRY_GIT"
      echo "RUSTUP_HOME: $RUSTUP_HOME"
      echo "PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON: $PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON"
      echo "PIP_NO_BUILD_ISOLATION: $PIP_NO_BUILD_ISOLATION"
      echo "PIP_USE_PEP517: $PIP_USE_PEP517"
      echo "PIP_PREFER_BINARY: $PIP_PREFER_BINARY"
      echo "PIP_NO_CACHE_DIR: $PIP_NO_CACHE_DIR"
      echo ""

      # Show what Cargo sees for its environment
      echo "=== CARGO ENVIRONMENT (AS SEEN BY CARGO) ==="
      cargo env 2>/dev/null | grep -E "HOME|TARGET|REGISTRY" || echo "  Note: cargo env not available (cargo may not be installed yet)"
      echo ""

      # Create directory structure for Cargo and Rust
      echo "=== CREATING DIRECTORY STRUCTURE ==="
      mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" "$CARGO_REGISTRY_INDEX" "$CARGO_REGISTRY_GIT" "$RUSTUP_HOME"

      # Create .cargo/config to override registry and git locations
      echo "=== CREATING .CARGO/CONFIG ==="
      mkdir -p "$CARGO_HOME/.cargo"
      cat > "$CARGO_HOME/.cargo/config" <<'EOF'
[registry]
index = "$CARGO_REGISTRY_INDEX"

[source.git]
[net]
git-fetch-with-cli = true
EOF
      echo "Created $CARGO_HOME/.cargo/config"
      echo "Contents:"
      cat "$CARGO_HOME/.cargo/config"
      echo ""

      # Verify all directories are writable
      echo "=== VERIFYING DIRECTORY PERMISSIONS ==="
      dirs_to_check=("$CARGO_HOME" "$CARGO_TARGET_DIR" "$CARGO_REGISTRY_INDEX" "$CARGO_REGISTRY_GIT" "$RUSTUP_HOME" "$CARGO_HOME/.cargo")
      all_writable=true
      for dir in "${dirs_to_check[@]}"; do
        if [ ! -w "$dir" ]; then
          echo "ERROR: $dir is not writable"
          all_writable=false
        fi
        # Test write access
        test_file="$dir/.write_test_$$"
        if ! touch "$test_file" 2>/dev/null; then
          echo "ERROR: Cannot write to $dir"
          all_writable=false
        else
          rm -f "$test_file"
        fi
      done

      if [ "$all_writable" = false ]; then
        echo "FATAL: One or more directories are not writable"
        exit 1
      fi
      echo "✓ All directories are writable"
      echo ""

      # UPGRADE PIP TO ENSURE WE HAVE THE LATEST WHEEL SUPPORT
      echo "=== UPGRADING PIP ==="
      pip install --upgrade pip
      echo ""

      # INSTALL PYDANTIC-CORE - TRY TO GET BINARY WHEEL FIRST
      echo "=== INSTALLING PYDANTIC-CORE ==="

      # First try: install without specifying version to get latest compatible binary wheel
      echo "Attempt 1: Installing pydantic-core (preferring binary wheels)..."
      if pip install --only-binary :all: pydantic-core; then
        echo "SUCCESS: Installed pydantic-core as binary wheel"
      else
        echo "FAILED: Could not install pydantic-core as binary wheel"
        echo ""
        echo "This means there is no pre-built binary wheel available for:"
        echo "  Python $(python -c 'import sys; print(sys.version_info[:2])')"
        echo "  Platform $(python -c 'import platform; print(platform.platform())')"
        echo ""
        echo "Since PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON=0 is set, we will NOT attempt to build from source."
        echo ""
        echo "Options to resolve this:"
        echo "  1. Use a different version of pydantic that depends on a pydantic-core version with a binary wheel for this platform"
        echo "  2. Allow building from source by removing or setting PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON=1"
        echo "  3. Use a different base image/runtime that has compatible binary wheels"
        echo ""
        echo "Available pydantic-core versions (newest first):"
        pip index versions pydantic-core | head -20
        echo ""
        exit 1
      fi
      echo ""

      # INSTALL THE REST OF THE REQUIREMENTS
      echo "=== INSTALLING REMAINING REQUIREMENTS ==="
      pip install -r requirements.txt
      echo ""

      echo "=== BUILD PROCESS COMPLETED SUCCESSFULLY ==="
    startCommand: |
      cd backend
      echo "=== STARTING APPLICATION ==="
      # Ensure environment variables are set for runtime too
      export CARGO_HOME="/tmp/cargo"
      export CARGO_TARGET_DIR="/tmp/cargo-target"
      export CARGO_REGISTRY_INDEX="/tmp/cargo/registry/index"
      export CARGO_REGISTRY_GIT="/tmp/cargo/registry/git"
      export PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON="0"
      uvicorn app.main:app --host 0.0.0.0 --port $PORT