services:
  - type: web
    name: haliberrycake
    env: python
    plan: free
    envVars:
      # These are CRITICAL - must be set before any pip install runs
      CARGO_HOME: /tmp/cargo
      CARGO_TARGET_DIR: /tmp/cargo-target
      # Prevent building pydantic-core from source
      PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON: 0
    buildCommand: |
      cd backend
      echo "=== DEBUG: Environment variables at start of build ==="
      env | grep -E "CARGO|PYDANTIC" || echo "No CARGO/PYDANTIC vars found"
      echo ""

      # Set and export variables explicitly
      export CARGO_HOME="/tmp/cargo"
      export CARGO_TARGET_DIR="/tmp/cargo-target"
      export PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON="0"
      export RUSTUP_HOME="/tmp/rustup"  # Also set Rustup home

      echo "=== After explicit export ==="
      echo "CARGO_HOME: $CARGO_HOME"
      echo "CARGO_TARGET_DIR: $CARGO_TARGET_DIR"
      echo "PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON: $PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON"
      echo "RUSTUP_HOME: $RUSTUP_HOME"
      echo ""

      # Create all necessary directories
      echo "=== Creating directories ==="
      mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUSTUP_HOME"
      ls -ld "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUSTUP_HOME"

      # Test write access extensively
      echo "=== Testing write access ==="
      for dir in "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUSTUP_HOME"; do
        echo "Testing $dir:"
        if touch "$dir/test_write_$$" 2>/dev/null; then
          echo "✓ Can write to $dir"
          rm -f "$dir/test_write_$$"
        else
          echo "✗ CANNOT write to $dir - CHECK PERMISSIONS!"
          ls -la "$(dirname "$dir")"
          exit 1
        fi
      done
      echo ""

      # Verify Cargo is using our directories
      echo "=== Verifying Cargo configuration ==="
      CARGO_HOME="$CARGO_HOME" cargo env | grep -E "HOME|TARGET" || echo "Cargo env check failed"
      echo ""

      # UPGRADE PIP FIRST - critical for good wheel support
      echo "=== Upgrading pip to latest ==="
      pip install --upgrade pip
      echo ""

      # Install pydantic-core with explicit binary preference and no build isolation
      echo "=== Installing pydantic-core (binary only) ==="
      # Try multiple approaches to get a binary wheel
      PIP_NO_BUILD_ISOLATION=1 PIP_USE_PEP517=1 pip install --only-binary :all: --no-cache-dir pydantic-core==2.18.4 && \
        echo "✓ pydantic-core installed successfully as binary" || {
        echo "✗ FAILED to install pydantic-core as binary"
        echo "Trying to find available wheels..."
        pip index versions pydantic-core
        echo ""
        echo "Trying without version constraint to get any binary..."
        PIP_NO_BUILD_ISOLATION=1 PIP_USE_PEP517=1 pip install --only-binary :all: --no-cache-dir pydantic-core && \
          echo "✓ pydantic-core installed (any version)" || {
          echo "✗ Still failing - checking if we can build from source with our env"
          # Last resort: try building from source but ensure our env is used
          CARGO_HOME="$CARGO_HOME" CARGO_TARGET_DIR="$CARGO_TARGET_DIR" RUSTUP_HOME="$RUSTUP_HOME" pip install --no-build-isolation --no-cache-dir pydantic-core && \
            echo "✓ pydantic-core built from source with our Cargo env" || {
            echo "✗ All attempts failed"
            exit 1
          }
        }
      }
      echo ""

      # Install the rest of the requirements
      echo "=== Installing remaining dependencies ==="
      # Use consistent flags
      PIP_NO_BUILD_ISOLATION=1 PIP_USE_PEP517=1 pip install --only-binary :all: --no-cache-dir -r requirements.txt
      echo ""
      echo "=== Build completed successfully ==="
    startCommand: |
      cd backend
      echo "=== Starting application ==="
      # Ensure environment variables are set for runtime too
      export CARGO_HOME="/tmp/cargo"
      export CARGO_TARGET_DIR="/tmp/cargo-target"
      export PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON="0"
      export RUSTUP_HOME="/tmp/rustup"
      uvicorn app.main:app --host 0.0.0.0 --port $PORT