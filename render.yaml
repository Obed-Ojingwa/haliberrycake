services:
  - type: web
    name: haliberrycake
    env: python
    plan: free
    envVars:
      CARGO_HOME: /tmp/cargo
      CARGO_TARGET_DIR: /tmp/cargo-target
    buildCommand: |
      cd backend
      pip install --upgrade pip setuptools wheel
      pip install --only-binary :all: -r requirements.txt
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT