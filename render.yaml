services:
  - type: web
    name: haliberrycake
    env: python
    plan: free
    envVars:
      # Point Cargo to writable directories to avoid read-only filesystem errors
      CARGO_HOME: /tmp/cargo
      CARGO_TARGET_DIR: /tmp/cargo-target
      # Prevent building pydantic-core from source (use pre-built wheels)
      PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON: 0
    buildCommand: |
      cd backend
      echo "=== Render Build Environment ==="
      echo "CARGO_HOME: $CARGO_HOME"
      echo "CARGO_TARGET_DIR: $CARGO_TARGET_DIR"
      echo "PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON: $PYDANTIC_CORE_BUILD_AGAINST_CURRENT_PYTHON"
      echo ""

      # Show environment variables for debugging
      echo "=== Environment Variables ==="
      env | grep -E "CARGO|PYDANTIC|PIP_" || echo "No matching env vars found"
      echo ""

      # Upgrade core packaging tools
      echo "=== Upgrading pip, setuptools, wheel ==="
      pip install --upgrade pip setuptools wheel
      echo ""

      # Install dependencies with preference for binary wheels
      echo "=== Installing dependencies (preferring binary wheels) ==="
      pip install --only-binary :all: -r requirements.txt
      echo ""
      echo "=== Build completed successfully ==="
    startCommand: |
      cd backend
      echo "=== Starting Haliberry Cake API ==="
      uvicorn app.main:app --host 0.0.0.0 --port $PORT