#
# Render Blueprint — defines the backend web service.
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO USE:
# 1. Push your code to GitHub (backend folder)
# 2. In Render dashboard → New → Blueprint → connect your repo
# 3. Render reads this file and creates the service automatically
# OR set up manually (see RENDER_DEPLOY_GUIDE.md)

services:
  - type: web
    name: haliberrycake-api
    runtime: python
    region: oregon          # change to: frankfurt (EU) for UK users
    plan: free              # upgrade to starter ($7/mo) for production
    rootDir: backend        # IMPORTANT: tells Render the app is in /backend subfolder
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard — never commit this
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://haliberrycake.co.uk
      - key: PRODUCTION_URL
        value: https://haliberrycake.co.uk